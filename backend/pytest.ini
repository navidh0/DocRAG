[pytest]
DJANGO_SETTINGS_MODULE = core.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
testpaths = tests
markers =
    auth: Authentication and user management tests
    documents: Document upload and processing tests
    qa: Question answering tests
    integration: End-to-end integration tests
addopts = 
    --verbose
    --tb=short

[coverage:run]
omit =
    */migrations/*
    core/settings.py
    core/wsgi.py
    core/asgi.py
    manage.py

[coverage:report]
skip_empty = True